# TMDB API Configuration
# API key should be set in local.properties file in project root
# Format: tmdb.api.key=your_api_key_here
# Can also be overridden by TMDB_API_KEY environment variable
tmdb.api.base-url=https://api.themoviedb.org/3

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.web.example.com.tmdb=DEBUG
logging.level.org.springframework.web.client=DEBUG